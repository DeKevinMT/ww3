<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#030a12" />
    <meta name="color-scheme" content="dark" />
    <style id="startup-critical-css">
      :root {
        color-scheme: dark;
        background: #030a12;
        font-family: "Segoe UI Variable Text", "Segoe UI", Arial, sans-serif;
        font-synthesis: none;
      }

      html, body, #app {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #030a12;
      }

      #startup-loader,
      #startup-loader * { box-sizing: border-box; }

      #startup-loader {
        position: fixed;
        inset: 0;
        z-index: 100;
        min-height: 100dvh;
        display: grid;
        place-items: end start;
        padding: clamp(28px, 6vw, 92px);
        isolation: isolate;
        contain: layout paint;
        background-color: #020811;
        background-image:
          linear-gradient(90deg, rgba(2, 8, 17, .22) 0%, rgba(2, 8, 17, .02) 55%, rgba(2, 8, 17, .18) 100%),
          linear-gradient(0deg, rgba(2, 8, 17, .78) 0%, rgba(2, 8, 17, .02) 55%),
          url("./src/assets/eonscar-command-bg.jpg");
        background-size: cover;
        background-position: center;
        color: #dffaff;
        opacity: 1;
        user-select: none;
        transition: opacity 220ms ease;
      }

      #startup-loader::before {
        content: "";
        position: absolute;
        inset: 0;
        z-index: -1;
        pointer-events: none;
        background:
          radial-gradient(ellipse at 30% 78%, rgba(7, 26, 41, .08), rgba(2, 8, 17, .62) 72%),
          linear-gradient(90deg, rgba(2, 8, 17, .38), transparent 56%);
      }

      #startup-loader::after {
        content: "";
        position: absolute;
        inset: 0;
        z-index: -1;
        pointer-events: none;
        opacity: .17;
        background-image: linear-gradient(rgba(113, 233, 255, .035) 1px, transparent 1px);
        background-size: 100% 4px;
        mask-image: linear-gradient(0deg, #000, transparent 72%);
      }

      #startup-loader.is-hidden { display: none; }
      #startup-loader.is-ready { opacity: 0; pointer-events: none; }
      .startup-loader__sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      .startup-loader__content {
        width: min(620px, calc(100vw - 56px));
        display: grid;
        gap: 20px;
        filter: drop-shadow(0 18px 42px rgba(0, 0, 0, .58));
      }

      .startup-loader__brand {
        display: flex;
        align-items: center;
        gap: clamp(14px, 2vw, 24px);
      }
      .startup-loader__brand > img {
        width: clamp(68px, 8vw, 108px);
        aspect-ratio: 1;
        object-fit: contain;
        filter: drop-shadow(0 0 22px rgba(113, 233, 255, .2));
      }
      .startup-loader__brand-copy { display: grid; justify-items: start; }
      .startup-loader__brand-copy > strong {
        color: #effcff;
        font-family: "Bahnschrift Condensed", "Arial Narrow", "Segoe UI", sans-serif;
        font-size: clamp(38px, 5vw, 70px);
        font-stretch: condensed;
        font-weight: 700;
        line-height: .84;
        letter-spacing: clamp(4px, .65vw, 9px);
        text-shadow: 0 0 32px rgba(113, 233, 255, .18);
      }
      .startup-loader__brand-copy > span {
        margin-top: 12px;
        color: #8fdceb;
        font-size: clamp(9px, .8vw, 12px);
        font-weight: 800;
        line-height: 1;
        letter-spacing: clamp(2px, .38vw, 5px);
      }

      .startup-loader__track {
        position: relative;
        width: 100%;
        height: 7px;
        overflow: hidden;
        border-radius: 999px;
        border: 1px solid rgba(152, 228, 242, .14);
        background: rgba(2, 10, 18, .74);
        box-shadow: inset 0 1px 4px rgba(0, 0, 0, .7), 0 0 24px rgba(113, 233, 255, .08);
      }

      .startup-loader__track i {
        display: block;
        width: 100%;
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(90deg, #2689a9, #71e9ff 72%, #d6fbff);
        box-shadow: 0 0 18px rgba(113, 233, 255, .72);
        transform: scaleX(.12);
        transform-origin: left;
        transition: transform 420ms cubic-bezier(.18, .74, .28, 1);
      }

      #startup-loader[data-loader-variant="boot"] .startup-loader__track i {
        animation: startup-uplink-progress .8s cubic-bezier(.18, .74, .28, 1) forwards;
      }
      #startup-loader[data-loader-stage="world"] .startup-loader__track i { transform: scaleX(.28); }
      #startup-loader[data-loader-stage="map"] .startup-loader__track i { transform: scaleX(.62); }
      #startup-loader[data-loader-stage="eonscar"] .startup-loader__track i { transform: scaleX(.88); }

      #startup-loader.is-ready .startup-loader__track i {
        animation: none;
        transform: scaleX(1);
        transition: transform 120ms ease-out;
      }

      .startup-loader__tip {
        min-height: 58px;
        display: grid;
        grid-template-columns: auto minmax(0, 1fr);
        align-items: start;
        gap: 14px;
      }
      .startup-loader__tip > span {
        padding-top: 2px;
        color: #71e9ff;
        font-size: 10px;
        font-weight: 900;
        line-height: 1.4;
        letter-spacing: 1.6px;
        white-space: nowrap;
      }
      .startup-loader__tip > p {
        max-width: 500px;
        margin: 0;
        color: #c1d5db;
        font-size: clamp(13px, 1.05vw, 16px);
        line-height: 1.48;
        text-wrap: balance;
      }

      @keyframes startup-uplink-progress {
        0% { transform: scaleX(.06); }
        100% { transform: scaleX(.82); }
      }

      @media (max-width: 680px) {
        #startup-loader {
          place-items: end center;
          padding: 28px 22px 42px;
          background-position: 62% center;
        }
        .startup-loader__content { width: 100%; gap: 17px; }
        .startup-loader__brand { gap: 12px; }
        .startup-loader__brand > img { width: 62px; }
        .startup-loader__brand-copy > strong { letter-spacing: 3px; }
        .startup-loader__brand-copy > span { margin-top: 8px; letter-spacing: 2px; }
        .startup-loader__tip { grid-template-columns: 1fr; gap: 5px; }
        .startup-loader__tip > p { font-size: 13px; }
      }

      @media (prefers-reduced-motion: reduce) {
        #startup-loader { transition-duration: 1ms; }
        .startup-loader__track i { animation: none !important; }
        #startup-loader.is-ready .startup-loader__track i { transition-duration: 1ms; }
      }
    </style>
    <link rel="preload" as="image" href="./src/assets/eonscar-command-bg.jpg" fetchpriority="high" />
    <link rel="preload" as="image" href="./src/assets/brand/eonscar-logo-transparent.png" />
    <link rel="icon" href="./src/assets/brand/eonscar-profile.png" type="image/png" />
    <meta
      name="description"
      content="EONSCAR — command nations through a fractured world and carry every lesson across timelines."
    />
    <title>EONSCAR</title>
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body>
    <div id="app">
      <div id="startup-loader" role="status" aria-live="polite" aria-atomic="true" aria-hidden="false" data-loader-variant="boot" data-loader-stage="boot">
        <span class="startup-loader__sr-only">Connecting to EONSCAR account</span>
        <div class="startup-loader__content">
          <div class="startup-loader__brand" aria-hidden="true">
            <img src="./src/assets/brand/eonscar-logo-transparent.png" alt="" />
            <div class="startup-loader__brand-copy"><strong>EONSCAR</strong><span>EONSCAR REMEMBERS.</span></div>
          </div>
          <div class="startup-loader__track" aria-hidden="true"><i></i></div>
          <div class="startup-loader__tip" role="note"><span>FIELD INTEL</span><p data-loader-tip>Land borders are the most reliable routes for expansion.</p></div>
        </div>
      </div>
      <div id="game-canvas" aria-label="Interactive EONSCAR world command map"></div>
      <div id="hud" aria-live="polite"></div>
      <div id="tooltip" role="tooltip"></div>
      <div id="toast-layer" aria-live="assertive"></div>
    </div>
  </body>
</html>
