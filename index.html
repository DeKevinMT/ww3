<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#030a12" />
    <meta name="color-scheme" content="dark" />
    <style id="startup-critical-css">
      :root {
        color-scheme: dark;
        background: #030a12;
        font-family: "Segoe UI Variable Text", "Segoe UI", Arial, sans-serif;
        font-synthesis: none;
      }

      html, body, #app {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #030a12;
      }

      #startup-loader,
      #startup-loader * { box-sizing: border-box; }

      #startup-loader {
        position: fixed;
        inset: 0;
        z-index: 100;
        min-height: 100dvh;
        display: grid;
        place-content: center;
        gap: 18px;
        isolation: isolate;
        contain: layout paint;
        background: radial-gradient(circle at 50% 42%, #102b3c 0%, #071522 42%, #030a12 100%);
        color: #dffaff;
        opacity: 1;
        user-select: none;
        transition: opacity 220ms ease;
      }

      #startup-loader.is-hidden { display: none; }
      #startup-loader.is-ready { opacity: 0; pointer-events: none; }
      #startup-loader[data-loader-variant="boot"] .startup-loader__deployment,
      #startup-loader[data-loader-variant="deployment"] .startup-loader__boot { display: none; }

      .startup-loader__sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      .startup-loader__identity {
        display: flex;
        align-items: center;
        gap: 14px;
        color: #dffaff;
      }

      .startup-loader__identity > span {
        width: 44px;
        height: 44px;
        display: grid;
        place-items: center;
        border: 1px solid rgba(107, 221, 242, 0.62);
        border-radius: 9px;
        background: rgba(107, 221, 242, 0.09);
        color: #a7effb;
        font-size: 13px;
        font-weight: 900;
        letter-spacing: 1px;
      }

      .startup-loader__identity div { display: grid; gap: 3px; }
      .startup-loader__identity strong { font-size: 14px; letter-spacing: 2.2px; }
      .startup-loader__identity small { color: #9ab5c0; font-size: 11px; letter-spacing: 1.1px; }

      .startup-loader__boot,
      .startup-loader__deployment { display: grid; gap: 18px; }

      .startup-loader__deployment { width: min(520px, calc(100vw - 36px)); }
      .startup-loader__deployment-head { display: grid; grid-template-columns: 78px minmax(0, 1fr); align-items: center; gap: 18px; }
      .startup-loader__flag {
        width: 78px;
        aspect-ratio: 4 / 3;
        display: grid;
        place-items: center;
        overflow: hidden;
        border: 1px solid rgba(107, 221, 242, .45);
        border-radius: 9px;
        background: rgba(107, 221, 242, .09);
        font-size: 15px;
        font-weight: 900;
      }
      .startup-loader__flag img { width: 100%; height: 100%; object-fit: cover; }
      .startup-loader__deployment-copy { min-width: 0; display: grid; gap: 3px; }
      .startup-loader__deployment-copy > span { color: #7ce9f8; font-size: 11px; font-weight: 900; line-height: 1.3; letter-spacing: 1.3px; }
      .startup-loader__deployment-copy strong { overflow-wrap: anywhere; font-size: clamp(22px, 5vw, 32px); line-height: 1; letter-spacing: -.6px; }
      .startup-loader__deployment-copy small { color: #9ab5c0; font-size: 12px; line-height: 1.4; }

      .startup-loader__track {
        width: min(310px, 72vw);
        height: 4px;
        overflow: hidden;
        border-radius: 999px;
        background: rgba(126, 190, 207, 0.13);
      }

      .startup-loader__track i {
        display: block;
        width: 100%;
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(90deg, #5bbed1, #9df1ff);
        box-shadow: 0 0 14px rgba(107, 221, 242, 0.45);
        transform: scaleX(0.16);
        transform-origin: left;
        transition: transform 180ms ease-out;
      }

      #startup-loader[data-loader-variant="boot"] .startup-loader__track i {
        animation: startup-uplink-progress .65s cubic-bezier(.18, .74, .28, 1) forwards;
      }
      #startup-loader[data-loader-stage="world"] .startup-loader__track i { transform: scaleX(.3); }
      #startup-loader[data-loader-stage="map"] .startup-loader__track i { transform: scaleX(.64); }
      #startup-loader[data-loader-stage="apex"] .startup-loader__track i { transform: scaleX(.88); }

      #startup-loader.is-ready .startup-loader__track i {
        animation: none;
        transform: scaleX(1);
        transition: transform 120ms ease-out;
      }

      .startup-loader__steps { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
      .startup-loader__steps span { min-width: 0; display: grid; gap: 4px; padding: 9px 10px; border: 1px solid rgba(126, 190, 207, .11); border-radius: 8px; color: #7f9ba7; background: rgba(3, 13, 22, .32); font-size: 11px; line-height: 1.3; }
      .startup-loader__steps b { color: inherit; font-size: 11px; letter-spacing: .7px; }
      #startup-loader[data-loader-stage="world"] .startup-loader__steps span:first-child,
      #startup-loader[data-loader-stage="map"] .startup-loader__steps span:nth-child(-n+2),
      #startup-loader[data-loader-stage="apex"] .startup-loader__steps span { border-color: rgba(107, 221, 242, .32); color: #c9f8ff; background: rgba(107, 221, 242, .075); }

      @keyframes startup-uplink-progress {
        0% { transform: scaleX(0.08); }
        100% { transform: scaleX(0.82); }
      }

      @media (max-width: 520px) {
        .startup-loader__deployment-head { grid-template-columns: 62px minmax(0, 1fr); gap: 13px; }
        .startup-loader__flag { width: 62px; }
        .startup-loader__steps { grid-template-columns: 1fr; }
      }

      @media (prefers-reduced-motion: reduce) {
        #startup-loader { transition-duration: 1ms; }
        .startup-loader__track i { animation: none !important; }
        #startup-loader.is-ready .startup-loader__track i { transition-duration: 1ms; }
      }
    </style>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2307111f'/%3E%3Cpath d='M15 17h34v9H26v7h19v9H26v15H15z' fill='%236bdef2'/%3E%3C/svg%3E" />
    <meta
      name="description"
      content="Frontier Command — a modern real-time territorial war game with stat-based units."
    />
    <title>Frontier Command</title>
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body>
    <div id="app">
      <div id="startup-loader" role="status" aria-live="polite" aria-atomic="true" aria-hidden="false" data-loader-variant="boot" data-loader-stage="boot">
        <span class="startup-loader__sr-only">Connecting to APEX account</span>
        <div class="startup-loader__boot">
          <div class="startup-loader__identity" aria-hidden="true">
            <span>◆</span>
            <div><strong>APEX UPLINK</strong><small>LOADING PROFILE &amp; ACTIVE TIMELINE</small></div>
          </div>
          <div class="startup-loader__track" aria-hidden="true"><i></i></div>
        </div>
        <div class="startup-loader__deployment" aria-hidden="true">
          <div class="startup-loader__deployment-head"><div class="startup-loader__flag" data-loader-country-flag>◆</div><div class="startup-loader__deployment-copy"><span>TIMELINE DEPLOYMENT</span><strong data-loader-country>Flagship</strong><small><b data-loader-mode>Campaign</b> · <span data-loader-year>2026</span></small></div></div>
          <div class="startup-loader__steps"><span><b>01 · TIMELINE</b>Generating theater</span><span><b>02 · WORLD MAP</b>Synchronizing borders</span><span><b>03 · APEX</b>Deploying Vanguard</span></div>
          <div class="startup-loader__track" aria-hidden="true"><i></i></div>
        </div>
      </div>
      <div id="game-canvas" aria-label="Interactive world war map"></div>
      <div id="hud" aria-live="polite"></div>
      <div id="tooltip" role="tooltip"></div>
      <div id="toast-layer" aria-live="assertive"></div>
    </div>
  </body>
</html>
